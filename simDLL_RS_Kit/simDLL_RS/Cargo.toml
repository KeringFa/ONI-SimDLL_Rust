[package]
name = "simdll_rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Rust port of Oxygen Not Included's simDLL.dll"

[lib]
name = "SimDLL"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1.19"
chrono = "0.4"
rayon = { version = "1", optional = true }

[features]
default = []
d3-rayon = ["dep:rayon"]
# d4-slice 依赖 d3-rayon：两条路线共用同一个 rayon 持久池，
# 避免各建一个池造成嵌套池争抢（项目既有设计目标）。
d4-slice = ["d3-rayon"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
