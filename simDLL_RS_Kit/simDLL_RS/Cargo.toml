[package]
name = "simdll_rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Rust port of Oxygen Not Included's simDLL.dll"

[lib]
name = "SimDLL"
crate-type = ["cdylib", "rlib"]

[dependencies]
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1.19"
chrono = "0.4"
rayon = { version = "1", optional = true }

# Windows 专属：SRWLOCK/条件变量、loader hook（VirtualProtect）、crash dump（SEH/MiniDump）、
# CPU 拓扑/亲和。Linux 下对应实现见 stl_shim（pthread+futex）、loader_hook（dlopen/dlsym+mprotect）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

# Linux：pthread 互斥、futex 条件变量、dlopen/dlsym、mprotect（loader hook）。
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = []
d3-rayon = ["dep:rayon"]

[profile.release]
panic = "unwind"
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
