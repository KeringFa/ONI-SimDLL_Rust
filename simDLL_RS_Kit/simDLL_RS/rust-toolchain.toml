# simDLL_RS 工具链配置
#
# 作用：在这个目录下执行 cargo / rustc 时，rustup 会按这里的声明准备工具链，
#       不受机器上 "rustup default" 影响。
#
# 版本策略（2026-11-21 修订）：跟踪 stable，不再锁死具体小版本。
#   原先是 channel = "1.98.0"，理由只是"当时最新 stable"；三条约束其实都是下限
#   （Cargo.lock 为 v4 需 >= 1.78；windows 0.58 / rayon / once_cell 需 1.7x 以上；
#   不追 nightly）。锁死小版本的实际代价：换机器要额外下载一整套工具链，
#   而 rustup 把 "1.98.0" 与 "stable" 当作两个不同工具链，即使版本号相同也重下。
#   MSRV 下限见 Cargo.toml 的 rust-version。
#
# 发版纪律（替代原 pin 的可复现性）：每次发布前把 `rustc -vV` 的输出
#   记进发布说明/提交信息。出问题时才知道那版是用哪个编译器出的。
#
# 注意：这个文件只管 Rust 编译器。Windows 上编译 cdylib 还必须有
#       Visual Studio 生成工具（MSVC 的 link.exe），rustup 装不了。

[toolchain]
channel = "stable"
components = ["rustfmt", "clippy", "rust-src"]
targets = ["x86_64-pc-windows-msvc"]
profile = "minimal"
